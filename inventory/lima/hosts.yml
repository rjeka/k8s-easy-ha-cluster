---
# Inventory for the local Lima stand (stand/up.sh)
all:
  vars:
    ansible_user: "{{ lookup('env', 'USER') }}"
    ansible_ssh_private_key_file: ~/.lima/_config/user
  children:
    k8s_cluster:
      children:
        control_plane:
          hosts:
            k8s-master00: {ansible_host: 192.168.105.201}
            k8s-master01: {ansible_host: 192.168.105.202}
            k8s-master02: {ansible_host: 192.168.105.203}
        workers:
          hosts:
            k8s-worker00: {ansible_host: 192.168.105.211}
