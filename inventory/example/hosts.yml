---
# Copy this directory to inventory/<your-cluster> and adjust addresses.
# control_plane must contain an odd number of hosts (3 by default).
all:
  vars:
    ansible_user: ubuntu
  children:
    k8s_cluster:
      children:
        control_plane:
          hosts:
            cp1: {ansible_host: 192.168.56.11}
            cp2: {ansible_host: 192.168.56.12}
            cp3: {ansible_host: 192.168.56.13}
        workers:
          hosts:
            worker1: {ansible_host: 192.168.56.21}
