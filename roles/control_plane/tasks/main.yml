---
- name: Check whether this node has joined the cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: control_plane_admin_conf

- name: Initialize the first control plane node
  ansible.builtin.include_tasks: init.yml
  when: inventory_hostname == groups['control_plane'][0]

# Ask the cluster rather than trusting local files: a failed join leaves
# admin.conf behind without a working member
- name: Check whether the node is registered in the cluster
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf get node {{ inventory_hostname }} -o name
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: control_plane_registered
  changed_when: false
  failed_when: false
  when: inventory_hostname != groups['control_plane'][0]

- name: Join the other control plane nodes
  ansible.builtin.include_tasks: join.yml
  when:
    - inventory_hostname != groups['control_plane'][0]
    - control_plane_registered.rc != 0

- name: Create kubeconfig directory for the Ansible user
  ansible.builtin.file:
    path: "~{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0700"

- name: Give the Ansible user kubectl access on the node
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "~{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    mode: "0600"

- name: Wait for the API server behind the VIP
  ansible.builtin.uri:
    url: "https://{{ k8s_vip }}:{{ k8s_api_port }}/readyz"
    validate_certs: false
  register: control_plane_readyz
  until: control_plane_readyz.status == 200
  retries: 30
  delay: 5
  run_once: true

- name: Fetch admin kubeconfig
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ k8s_kubeconfig_local_path }}"
    flat: true
  run_once: true
