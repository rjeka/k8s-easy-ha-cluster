---
# Cluster objects are managed from the Ansible host with this kubeconfig.
# run_once plus delegation keeps it working under --limit.
- name: Create local artifacts directory
  ansible.builtin.file:
    path: "{{ k8s_kubeconfig_local_path | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Fetch admin kubeconfig
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ k8s_kubeconfig_local_path }}"
    flat: true
  delegate_to: "{{ groups['control_plane'][0] }}"
  run_once: true

- name: Restrict local admin kubeconfig
  ansible.builtin.file:
    path: "{{ k8s_kubeconfig_local_path }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  run_once: true
