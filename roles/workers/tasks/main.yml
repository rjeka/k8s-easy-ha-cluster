---
# Ask the cluster rather than trusting kubelet.conf: a failed join can leave
# it behind without a registered Node. Errors other than NotFound fail.
- name: Check whether the node is registered in the cluster
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf get node {{ inventory_hostname }} -o name
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: workers_registered
  changed_when: false
  failed_when: workers_registered.rc != 0 and 'NotFound' not in workers_registered.stderr

- name: Join the cluster
  when: workers_registered.rc != 0
  block:
    - name: Clean up a previous failed join
      ansible.builtin.command: kubeadm reset --force
      args:
        removes: /etc/kubernetes/kubelet.conf

    - name: Get join parameters from the first control plane node
      ansible.builtin.include_role:
        name: control_plane
        tasks_from: join_info.yml

    - name: Write kubeadm join config
      ansible.builtin.template:
        src: "{{ role_path }}/../control_plane/templates/kubeadm-join.yaml.j2"
        dest: /etc/kubernetes/kubeadm-config.yaml
        mode: "0600"

    # Workers do not touch etcd, so they join in parallel
    - name: Run kubeadm join
      ansible.builtin.command: kubeadm join --config /etc/kubernetes/kubeadm-config.yaml
      changed_when: true

- name: Label worker node
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    label node {{ inventory_hostname }} node-role.kubernetes.io/worker= --overwrite
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: workers_label
  changed_when: "'not labeled' not in workers_label.stdout"
