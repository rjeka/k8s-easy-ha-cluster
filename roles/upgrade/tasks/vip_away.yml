---
- name: Park the kube-vip static pod
  ansible.builtin.command: mv {{ upgrade_kube_vip_manifest }} {{ upgrade_kube_vip_parked }}
  args:
    removes: "{{ upgrade_kube_vip_manifest }}"

# Requests through the VIP may fail while it moves; those are retried too
- name: Wait until another node holds the VIP lease
  kubernetes.core.k8s_info:
    kubeconfig: "{{ upgrade_kubeconfig }}"
    api_version: coordination.k8s.io/v1
    kind: Lease
    namespace: kube-system
    name: plndr-cp-lock
  delegate_to: localhost
  become: false
  register: upgrade_vip_lease
  until: >-
    upgrade_vip_lease is succeeded and upgrade_vip_lease.resources | length > 0
    and upgrade_vip_lease.resources[0].spec.holderIdentity | default('') not in ['', inventory_hostname]
  retries: 30
  delay: 2

# kube-vip may leave the address behind when its pod is removed
- name: Drop the VIP from this node
  ansible.builtin.command: ip addr del {{ k8s_vip }}/32 dev {{ k8s_vip_interface }}
  register: upgrade_vip_del
  changed_when: upgrade_vip_del.rc == 0
  failed_when: false
