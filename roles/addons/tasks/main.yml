---
- name: Install metrics-server
  kubernetes.core.helm:
    name: metrics-server
    chart_ref: metrics-server
    chart_repo_url: https://kubernetes-sigs.github.io/metrics-server/
    chart_version: "{{ addons_metrics_server_chart_version }}"
    release_namespace: kube-system
    kubeconfig: "{{ addons_kubeconfig }}"
    values:
      args: "{{ ['--kubelet-insecure-tls'] if addons_metrics_server_kubelet_insecure_tls else [] }}"
    wait: true
  when: addon_metrics_server_enabled

- name: Install cert-manager
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: cert-manager
    chart_repo_url: https://charts.jetstack.io
    chart_version: "v{{ addons_cert_manager_version }}"
    release_namespace: cert-manager
    create_namespace: true
    kubeconfig: "{{ addons_kubeconfig }}"
    values:
      crds:
        enabled: true
    wait: true
  when: addon_cert_manager_enabled
